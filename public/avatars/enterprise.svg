<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise avatar</title>
  <desc id="desc">A polished MacBook Pro node with a small voice waveform and starfield.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#2d4057"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="metal" x1="40" x2="200" y1="96" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7dde7"/>
      <stop offset="0.5" stop-color="#8f9bad"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="screen" x1="63" x2="177" y1="74" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#14213d"/>
      <stop offset="1" stop-color="#231942"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="240" height="240" rx="120" fill="url(#bg)"/>
  <g opacity=".65" fill="#f7d68a">
    <circle cx="48" cy="54" r="1.5"/>
    <circle cx="82" cy="31" r="1"/>
    <circle cx="171" cy="43" r="1.4"/>
    <circle cx="199" cy="82" r="1"/>
    <circle cx="34" cy="147" r="1.1"/>
    <circle cx="205" cy="174" r="1.2"/>
  </g>
  <g filter="url(#glow)">
    <path d="M52 78c0-8 6-14 14-14h108c8 0 14 6 14 14v75H52V78Z" fill="url(#metal)"/>
    <path d="M62 79c0-4 3-7 7-7h102c4 0 7 3 7 7v64H62V79Z" fill="url(#screen)"/>
    <path d="M36 154h168l-13 20H49l-13-20Z" fill="#c9d1dd"/>
    <path d="M88 157h64l-4 6H92l-4-6Z" fill="#7d8798"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="5">
    <path d="M86 113v-18" stroke="#68e1fd"/>
    <path d="M101 121V87" stroke="#f7d68a"/>
    <path d="M116 128V80" stroke="#68e1fd"/>
    <path d="M131 121V88" stroke="#f7d68a"/>

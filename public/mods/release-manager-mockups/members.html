<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Members — Release Manager</title>
<style>
:root{--bg:#070c1a;--surface:#0f172d;--surface2:#141f39;--fg:#e8ecf8;--muted:#8b93ad;--border:#1e2947;--violet:#b996f0;--pink:#f27fc0;--green:#4ade80;--amber:#fbbf24;--red:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:1140px;margin:0 auto;padding:32px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.topbar .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--violet),var(--pink))}
.topbar b{font-weight:700}
.topbar .crumb{color:var(--muted);font-size:13px}
.topbar .crumb span{color:var(--fg)}
h1{font-size:20px;font-weight:650;margin:0 0 20px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:0 12px 10px}
td{padding:13px 12px;border-top:1px solid var(--border)}
td.email{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid}
.chip-admin{color:var(--green);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.chip-approver{color:var(--violet);border-color:rgba(185,150,240,.4);background:rgba(185,150,240,.08)}
.chip-member{color:#c7cde0;border-color:var(--border);background:var(--surface2)}
.chip-viewer{color:var(--muted);border-color:var(--border);background:var(--surface2)}
.chip-active{color:var(--green);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.06);font-weight:500}
.chip-pending{color:var(--amber);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.rail h2{font-size:14px;font-weight:650;margin:0 0 14px}
.rail label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.rail input,.rail select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit;outline:none;margin-bottom:14px}
.rail input:focus,.rail select:focus{border-color:var(--violet)}
.send{width:100%;border:none;border-radius:10px;padding:11px;background:var(--violet);color:#160c2b;font-weight:700;cursor:pointer;font-size:14px}
.send:hover{filter:brightness(1.08)}
.rail .note{color:var(--muted);font-size:12px;margin:12px 0 0}
.row-flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:rgba(185,150,240,.12)}100%{background:transparent}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><div class="dot"></div><b>Release Manager</b><span class="crumb">Admin › <span>Members</span></span></div>
  <h1>Members</h1>

  <div class="layout">
    <main class="card" data-od-id="members-table">
      <table>
        <thead><tr><th>Email</th><th>Role</th><th>Status</th></tr></thead>
        <tbody id="rows">
          <tr data-od-id="member-row-fikayo"><td class="email">fikayo@heraldlabs.co</td><td><span class="chip chip-admin">Admin</span></td><td><span class="chip chip-active">Active</span></td></tr>
          <tr data-od-id="member-row-ada"><td class="email">ada@heraldlabs.co</td><td><span class="chip chip-approver">Approver</span></td><td><span class="chip chip-active">Active</span></td></tr>
          <tr data-od-id="member-row-book"><td class="email">book@heraldlabs.co</td><td><span class="chip chip-member">Member</span></td><td><span class="chip chip-active">Active</span></td></tr>
          <tr data-od-id="member-row-scotty"><td class="email">scotty@heraldlabs.co</td><td><span class="chip chip-member">Member</span></td><td><span class="chip chip-pending">Invite sent</span></td></tr>
        </tbody>
      </table>
    </main>

    <aside class="card rail" data-od-id="invite-rail">
      <h2>Invite member</h2>
      <label for="inv-email">Email</label>
      <input id="inv-email" type="email" placeholder="teammate@heraldlabs.co">
      <label for="inv-role">Role</label>
      <select id="inv-role">
        <option>Member</option><option>Approver</option><option>Admin</option><option>Viewer</option>
      </select>
      <button class="send" data-od-id="invite-send" onclick="sendInvite()">Send</button>
      <p class="note">Invites expire after 7 days. Members sign in with Google or GitHub using the invited email.</p>
    </aside>
  </div>
</div>
<script>
function sendInvite(){
  const email = document.getElementById("inv-email").value.trim();
  const role = document.getElementById("inv-role").value;
  if(!email || !email.includes("@")){ document.getElementById("inv-email").focus(); return; }
  const cls = {"Admin":"chip-admin","Approver":"chip-approver","Member":"chip-member","Viewer":"chip-viewer"}[role];
  const tr = document.createElement("tr");
  tr.className = "row-flash";
  tr.innerHTML = `<td class="email">${email.replace(/</g,"&lt;")}</td><td><span class="chip ${cls}">${role}</span></td><td><span class="chip chip-pending">Invite sent</span></td>`;
  document.getElementById("rows").appendChild(tr);
  document.getElementById("inv-email").value = "";
}
</script>
</body>
</html>

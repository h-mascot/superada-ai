<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projects — Release Manager</title>
<style>
:root{--bg:#070c1a;--surface:#0f172d;--surface2:#141f39;--fg:#e8ecf8;--muted:#8b93ad;--border:#1e2947;--violet:#b996f0;--pink:#f27fc0;--green:#4ade80;--amber:#fbbf24;--red:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:1140px;margin:0 auto;padding:32px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.topbar .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--violet),var(--pink))}
.topbar b{font-weight:700}
.topbar .who{margin-left:auto;color:var(--muted);font-size:13px}
h1{font-size:20px;font-weight:650;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 24px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
a.proj{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;color:var(--fg);text-decoration:none;transition:border-color .15s}
a.proj:hover{border-color:var(--violet)}
.proj .name{font-size:16px;font-weight:650}
.proj .meta{display:flex;gap:14px;color:var(--muted);font-size:13px}
.proj .meta b{color:var(--fg);font-weight:600}
.proj .channels{display:flex;gap:8px;align-items:center}
.ch{width:26px;height:26px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.ver{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--fg)}
.ver small{color:var(--muted);font-family:inherit;font-size:11px}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid}
.chip-review{color:var(--amber);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.chip-published{color:var(--green);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.chip-empty{color:var(--muted);border-color:var(--border);background:var(--surface2);font-weight:500}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><div class="dot"></div><b>Release Manager</b><span class="who">ada@heraldlabs.co · Approver</span></div>
  <h1>Projects</h1>
  <p class="sub">Org connected: HeraldLab · 3 projects · 6 repos · 2 channels</p>

  <div class="grid">
    <a class="proj" href="project-detail.html" data-od-id="project-card-release-manager">
      <div class="name">Release Manager</div>
      <div class="meta"><span><b>3</b> repos</span><span>Latest <span class="ver">v2.4.0 <small>Nov 24</small></span></span></div>
      <div class="channels"><span class="ch">𝕏</span><span class="ch">in</span></div>
      <div class="foot"><span class="ver">v2.4.0 <small>· Nov 24</small></span><span class="chip chip-review">in review</span></div>
    </a>

    <a class="proj" href="project-detail.html" data-od-id="project-card-anchorage">
      <div class="name">Anchorage</div>
      <div class="meta"><span><b>2</b> repos</span><span>Latest <span class="ver">v1.9.2 <small>Nov 22</small></span></span></div>
      <div class="channels"><span class="ch">𝕏</span><span class="ch">in</span></div>
      <div class="foot"><span class="ver">v1.9.2 <small>· Nov 22</small></span><span class="chip chip-published">published</span></div>
    </a>

    <a class="proj" href="project-detail.html" data-od-id="project-card-weeklyclaw">
      <div class="name">WeeklyClaw</div>
      <div class="meta"><span><b>1</b> repo</span></div>
      <div class="channels"><span class="ch">𝕏</span></div>
      <div class="foot"><span class="ver" style="color:var(--muted)">—</span><span class="chip chip-empty">no releases yet</span></div>
    </a>
  </div>
</div>
</body>
</html>

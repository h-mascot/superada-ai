<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Use-case catalog funnel</title>
<desc id="desc">Candidates become publishable only after structure, evidence, coverage, QA, and approval gates.</desc>

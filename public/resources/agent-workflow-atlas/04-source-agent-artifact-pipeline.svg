puts</text><line x1="452" y1="508" x2="544" y2="508" stroke="#60C9F2" stroke-width="3" marker-end="url(#arrow)"/><rect x="557" y="270" width="530" height="146" rx="18" fill="#0D1A2A" stroke="#35D0BA" stroke-width="2"/><rect x="582" y="292" width="162" height="30" rx="15" fill="#35D0BA" fill-opacity="0.13" stroke="#35D0BA" stroke-opacity="0.7"/><text x="663" y="312" fill="#35D0BA" font-size="13" font-weight="700" text-anchor="middle">TRIGGER + INTAKE</text><text x="582" y="355" fill="#A5B4C5" font-size="17" font-weight="520" text-anchor="start">Resolve the actor, beneficiary, source inputs,</text><text x="582" y="382" fill="#A5B4C5" font-size="17" font-weight="520" text-anchor="start">workflow-level tool path, and expected output.</text><line x1="822" y1="420" x2="822" y2="460" stroke="#35D0BA" stroke-width="3" marker-end="url(#arrow)"/><rect x="557" y="470" width="530" height="220" rx="18" fill="#0D1A2A" stroke="#A995E8" stroke-width="2"/><rect x="582" y="492" width="154" height="30" rx="15" fill="#A995E8" fill-opacity="0.13" stroke="#A995E8" stroke-opacity="0.7"/><text x="659" y="512" fill="#A995E8" font-size="13" font-weight="700" text-anchor="middle">ROUTE + EXECUTE</text><text x="822" y="559" fill="#F4F7FA" font-size="19" font-weight="740" text-anchor="middle">Ada · Assistant · Book · Geordi · Midas</text><text x="822" y="590" fill="#F4F7FA" font-size="19" font-weight="740" text-anchor="middle">Scotty · Spock · Uhura · Zora</text><text x="822" y="628" fill="#A5B4C5" font-size="14" font-weight="500" text-anchor="middle">Primary lanes route work; agents may collaborate across lanes.</text><rect x="627" y="648" width="196" height="30" rx="15" fill="#60C9F2" fill-opacity="0.13" stroke="#60C9F2" stroke-opacity="0.7"/><text x="725" y="668" fill="#60C9F2" font-size="13" font-weight="700" text-anchor="middle">SOURCE→CLAIM MAPPING</text><rect x="836" y="648" width="192" height="30" rx="15" fill="#F29D52" fill-opacity="0.13" stroke="#F29D52" stroke-opacity="0.7"/><text x=